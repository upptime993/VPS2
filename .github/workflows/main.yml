name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2025
    timeout-minutes: 360

    steps:
      # ============================================
      # STEP 1: Setup Python (cached di runner)
      # ============================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify Python
        run: |
          python --version
          pip --version

      # ============================================
      # STEP 2: Setup Node.js (cached di runner)
      # ============================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Node.js
        run: |
          node --version
          npm --version

      # ============================================
      # STEP 3: Konfigurasi RDP
      # ============================================
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 1 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force
          Write-Host "RDP configured!"

      - name: Configure runneradmin for RDP
        run: |
          $username = "runneradmin"
          $password = "P@ssw0rd123!"
          Enable-LocalUser -Name $username
          Set-LocalUser -Name $username -Password (ConvertTo-SecureString -AsPlainText $password -Force)
          Add-LocalGroupMember -Group "Administrators" -Member $username -ErrorAction SilentlyContinue
          echo "RDP_USER=$username" >> $env:GITHUB_ENV
          echo "RDP_PASS=$password" >> $env:GITHUB_ENV

      # ============================================
      # STEP 4: Install Visual Studio Code
      # ============================================
      - name: Install Visual Studio Code
        run: |
          Write-Host "Downloading VS Code..."
          $url = "https://update.code.visualstudio.com/latest/win32-x64/stable"
          $out = "$env:TEMP\vscode.exe"
          Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing
          Write-Host "Installing VS Code..."
          Start-Process -FilePath $out -ArgumentList "/verysilent /norestart /mergetasks=!runcode,addtopath,desktopicon" -Wait -NoNewWindow
          Remove-Item $out -Force
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path", "Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path", "User")
          Write-Host "VS Code installed!"

      # ============================================
      # STEP 5: Buat script install Antigravity di Desktop
      # Tidak diinstall saat workflow supaya lebih cepat
      # Klik 2x file .bat ini setelah RDP connect
      # ============================================
      - name: Create Antigravity Installer Script on Desktop
        run: |
          $desktop = "C:\Users\Public\Desktop"
          $batFile = "$desktop\Install-Antigravity.bat"
          "@echo off" | Out-File -FilePath $batFile -Encoding ASCII
          "echo ============================================" | Add-Content -Path $batFile
          "echo  Installing Google Antigravity IDE..." | Add-Content -Path $batFile
          "echo  Harap tunggu, ukuran file sekitar 500MB" | Add-Content -Path $batFile
          "echo ============================================" | Add-Content -Path $batFile
          "echo." | Add-Content -Path $batFile
          "echo Downloading dari Google CDN..." | Add-Content -Path $batFile
          "powershell -Command `"Invoke-WebRequest -Uri 'https://edgedl.me.gvt1.com/edgedl/release2/j0qc3/antigravity/stable/1.21.9-4905428782546944/windows-x64/Antigravity.exe' -OutFile '%TEMP%\AntigravitySetup.exe' -UseBasicParsing`"" | Add-Content -Path $batFile
          "echo Download selesai! Memulai instalasi..." | Add-Content -Path $batFile
          "start /wait %TEMP%\AntigravitySetup.exe /S /VERYSILENT /SUPPRESSMSGBOXES /norestart /SP-" | Add-Content -Path $batFile
          "del %TEMP%\AntigravitySetup.exe" | Add-Content -Path $batFile
          "echo." | Add-Content -Path $batFile
          "echo Antigravity berhasil diinstall!" | Add-Content -Path $batFile
          "echo Buka dari Start Menu lalu login dengan akun Gmail." | Add-Content -Path $batFile
          "pause" | Add-Content -Path $batFile
          Write-Host "Antigravity installer script created at Desktop!"

      # ============================================
      # STEP 6: Install Android SDK + Buat AVD
      # FIX: license accept menggunakan temporary file
      # bukan pipe langsung (pipe kosong tidak valid di PS)
      # ============================================
      - name: Install Android SDK and Create AVD
        run: |
          Write-Host "Setting up Android SDK..."
          $androidHome = "C:\Android"
          $sdkZip = "$env:TEMP\cmdtools.zip"
          $sdkUrl = "https://dl.google.com/android/repository/commandlinetools-win-11076708_latest.zip"

          Invoke-WebRequest -Uri $sdkUrl -OutFile $sdkZip -UseBasicParsing
          New-Item -ItemType Directory -Path "$androidHome\cmdline-tools" -Force | Out-Null
          Expand-Archive -Path $sdkZip -DestinationPath "$androidHome\cmdline-tools" -Force

          $extracted = "$androidHome\cmdline-tools\cmdline-tools"
          if (Test-Path $extracted) {
            Rename-Item $extracted "$androidHome\cmdline-tools\latest" -Force
          }

          [System.Environment]::SetEnvironmentVariable("ANDROID_HOME", $androidHome, "Machine")
          [System.Environment]::SetEnvironmentVariable("ANDROID_SDK_ROOT", $androidHome, "Machine")
          $env:ANDROID_HOME = $androidHome
          $env:ANDROID_SDK_ROOT = $androidHome
          $sdkBin = "$androidHome\cmdline-tools\latest\bin"
          $env:Path = "$env:Path;$sdkBin;$androidHome\platform-tools;$androidHome\emulator"

          $sdkmanager = "$sdkBin\sdkmanager.bat"

          # FIX: tulis "y" ke file lalu redirect file ke sdkmanager
          # Ini cara yang benar untuk accept licenses di PowerShell
          $yesFile = "$env:TEMP\yes.txt"
          "y`ny`ny`ny`ny`ny`ny`ny`ny`ny" | Out-File -FilePath $yesFile -Encoding ASCII
          Write-Host "Accepting Android SDK licenses..."
          cmd /c "$sdkmanager --licenses < `"$yesFile`"" 2>&1 | Out-Null
          Remove-Item $yesFile -Force

          Write-Host "Installing emulator + system image Android 13..."
          & $sdkmanager "emulator" "platform-tools" "platforms;android-33" "system-images;android-33;google_apis;x86_64"

          Write-Host "Creating AVD: TestDevice..."
          $avdmanager = "$sdkBin\avdmanager.bat"
          $noFile = "$env:TEMP\no.txt"
          "no" | Out-File -FilePath $noFile -Encoding ASCII
          cmd /c "$avdmanager create avd --name TestDevice --package `"system-images;android-33;google_apis;x86_64`" --device pixel_6 --force < `"$noFile`"" 2>&1
          Remove-Item $noFile -Force

          $batFile = "C:\Users\Public\Desktop\Start-Android-Emulator.bat"
          "set ANDROID_HOME=C:\Android" | Out-File -FilePath $batFile -Encoding ASCII
          "set PATH=%PATH%;C:\Android\emulator;C:\Android\platform-tools" | Add-Content -Path $batFile
          "emulator -avd TestDevice -no-snapshot-load -gpu swiftshader_indirect -no-audio -no-boot-anim" | Add-Content -Path $batFile

          Remove-Item $sdkZip -Force
          Write-Host "Android SDK ready! AVD: TestDevice (Android 13, Pixel 6)"

      # ============================================
      # STEP 7: Install Tailscale
      # ============================================
      - name: Install Tailscale
        run: |
          Write-Host "Downloading Tailscale..."
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $out = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing
          Start-Process msiexec.exe -ArgumentList "/i `"$out`" /quiet /norestart" -Wait
          Remove-Item $out -Force
          Write-Host "Tailscale installed!"

      - name: Establish Tailscale Connection
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          & $ts up --authkey="$env:TAILSCALE_AUTH_KEY" --hostname="gh-runner-$env:GITHUB_RUN_ID"
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
            Start-Sleep -Seconds 5
            $tsIP = & $ts ip -4
            $retries++
          }
          if (-not $tsIP) {
            Write-Error "Tailscale IP tidak dapat diperoleh. Cek authkey di Secrets."
            exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      # ============================================
      # STEP 8: Verifikasi RDP
      # ============================================
      - name: Verify RDP Accessibility
        run: |
          Write-Host "Testing RDP ke $env:TAILSCALE_IP ..."
          $test = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $test.TcpTestSucceeded) {
            Write-Error "RDP port 3389 tidak bisa diakses!"
            exit 1
          }
          Write-Host "RDP port 3389 OK!"

      # ============================================
      # STEP 9: Maintain Connection
      # ============================================
      - name: Maintain Connection
        run: |
          Write-Host "============================================================"
          Write-Host "            RDP SIAP - SILAKAN CONNECT SEKARANG"
          Write-Host "============================================================"
          Write-Host "  Address  : $env:TAILSCALE_IP"
          Write-Host "  Username : $env:RDP_USER"
          Write-Host "  Password : $env:RDP_PASS"
          Write-Host ""
          Write-Host "  Terinstall otomatis:"
          Write-Host "    [OK] Python 3.13"
          Write-Host "    [OK] Node.js 22 LTS"
          Write-Host "    [OK] Visual Studio Code"
          Write-Host "    [OK] Android SDK + AVD TestDevice (Android 13 Pixel 6)"
          Write-Host "    [OK] Tailscale VPN"
          Write-Host ""
          Write-Host "  Install manual di Desktop setelah RDP connect:"
          Write-Host "    [BAT] Install-Antigravity.bat  -> klik 2x untuk install"
          Write-Host "    [BAT] Start-Android-Emulator.bat -> klik 2x untuk jalankan emulator"
          Write-Host "============================================================"
          while ($true) {
            Write-Host "[$(Get-Date -Format 'HH:mm:ss')] RDP aktif..."
            Start-Sleep -Seconds 300
          }
          
