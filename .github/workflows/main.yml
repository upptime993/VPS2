name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2025
    timeout-minutes: 360

    steps:
      # ============================================
      # STEP 1: Konfigurasi RDP
      # ============================================
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 1 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 1 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      - name: Configure runneradmin for RDP
        run: |
          $username = "runneradmin"
          $password = "P@ssw0rd123!"  # ⚠️ Ganti ini atau gunakan GitHub Secret

          Enable-LocalUser -Name $username
          Set-LocalUser -Name $username -Password (ConvertTo-SecureString -AsPlainText $password -Force)
          Add-LocalGroupMember -Group "Administrators" -Member $username -ErrorAction SilentlyContinue

          echo "RDP_USER=$username" >> $env:GITHUB_ENV
          echo "RDP_PASS=$password" >> $env:GITHUB_ENV

      # ============================================
      # STEP 2: Aktifkan Virtualisasi (Untuk Emulator)
      # ============================================
      - name: Enable Hyper-V and Virtualization Features
        run: |
          Write-Host "========================================="
          Write-Host "  Enabling Virtualization Features..."
          Write-Host "========================================="

          # Aktifkan semua fitur Hyper-V & Hypervisor tanpa restart
          DISM /Online /Enable-Feature /FeatureName:Microsoft-Hyper-V-All /All /NoRestart /Quiet
          DISM /Online /Enable-Feature /FeatureName:HypervisorPlatform /All /NoRestart /Quiet
          DISM /Online /Enable-Feature /FeatureName:VirtualMachinePlatform /All /NoRestart /Quiet

          Write-Host "Virtualization features enabled (no restart needed)!"

      # ============================================
      # STEP 3: Install Python Versi Terbaru
      # ============================================
      - name: Install Python Latest Version
        run: |
          Write-Host "========================================="
          Write-Host "  Installing Python Latest Version..."
          Write-Host "========================================="

          $pythonUrl = "https://www.python.org/ftp/python/3.13.4/python-3.13.4-amd64.exe"
          $installerPath = "$env:TEMP\python-installer.exe"

          Write-Host "Downloading Python installer..."
          Invoke-WebRequest -Uri $pythonUrl -OutFile $installerPath -UseBasicParsing

          Write-Host "Running Python installer (system-wide)..."
          Start-Process -FilePath $installerPath -ArgumentList `
            "/quiet", `
            "InstallAllUsers=1", `
            "PrependPath=1", `
            "Include_pip=1", `
            "Include_launcher=1", `
            "Include_test=0" `
            -Wait -NoNewWindow

          Remove-Item $installerPath -Force

          $env:Path = [System.Environment]::GetEnvironmentVariable("Path", "Machine") + ";" + `
                      [System.Environment]::GetEnvironmentVariable("Path", "User")

          Write-Host "`n--- Verifikasi Python ---"
          python --version
          pip --version
          Write-Host "Python installed successfully!`n"

      # ============================================
      # STEP 4: Install Node.js (Dibutuhkan Antigravity & Android tools)
      # ============================================
      - name: Install Node.js
        run: |
          Write-Host "========================================="
          Write-Host "  Installing Node.js LTS..."
          Write-Host "========================================="

          $nodeUrl = "https://nodejs.org/dist/lts/node-v22.15.0-x64.msi"
          $installerPath = "$env:TEMP\nodejs.msi"

          Invoke-WebRequest -Uri $nodeUrl -OutFile $installerPath -UseBasicParsing
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

          $env:Path = [System.Environment]::GetEnvironmentVariable("Path", "Machine") + ";" + `
                      [System.Environment]::GetEnvironmentVariable("Path", "User")

          Write-Host "Node.js installed!"
          node --version
          npm --version

      # ============================================
      # STEP 5: Install Google Antigravity IDE (Resmi)
      # ============================================
      - name: Install Google Antigravity IDE
        run: |
          Write-Host "========================================="
          Write-Host "  Installing Google Antigravity IDE..."
          Write-Host "  (Official from antigravity.google)"
          Write-Host "========================================="

          # Download installer resmi dari Google
          $antigravityUrl = "https://antigravity.google/download/win/x64/stable/AntigravitySetup.exe"
          $installerPath = "$env:TEMP\AntigravitySetup.exe"

          Write-Host "Downloading Antigravity from official Google source..."
          try {
            Invoke-WebRequest -Uri $antigravityUrl -OutFile $installerPath -UseBasicParsing
            Write-Host "Download successful!"
          } catch {
            # Fallback URL alternatif
            Write-Host "Primary URL failed, trying alternative..."
            $antigravityUrl = "https://antigravity.google/download/AntigravitySetup.exe"
            Invoke-WebRequest -Uri $antigravityUrl -OutFile $installerPath -UseBasicParsing
          }

          # Install diam-diam (silent install) — sama seperti VSCode installer behavior
          Write-Host "Running Antigravity installer silently..."
          Start-Process -FilePath $installerPath -ArgumentList `
            "/VERYSILENT", `
            "/SUPPRESSMSGBOXES", `
            "/NORESTART", `
            "/ALLUSERS", `
            "/SP-" `
            -Wait -NoNewWindow

          Remove-Item $installerPath -Force -ErrorAction SilentlyContinue

          # Buat shortcut di desktop Public agar bisa diakses via RDP
          $antigravityExe = "${env:ProgramFiles}\Google\Antigravity\Antigravity.exe"
          if (-not (Test-Path $antigravityExe)) {
            # Cek path alternatif (per-user install)
            $antigravityExe = "$env:LOCALAPPDATA\Programs\Antigravity\Antigravity.exe"
          }

          if (Test-Path $antigravityExe) {
            $shell = New-Object -ComObject WScript.Shell
            $shortcut = $shell.CreateShortcut("C:\Users\Public\Desktop\Antigravity.lnk")
            $shortcut.TargetPath = $antigravityExe
            $shortcut.Description = "Google Antigravity AI IDE"
            $shortcut.Save()
            Write-Host "Antigravity installed and shortcut created at Desktop!"
          } else {
            Write-Host "WARNING: Antigravity executable not found at expected path."
            Write-Host "Cek manual di: $env:ProgramFiles\Google\ atau $env:LOCALAPPDATA\Programs\"
          }

          Write-Host "Google Antigravity installed successfully!`n"

      # ============================================
      # STEP 6: Install Visual Studio Code
      # ============================================
      - name: Install Visual Studio Code
        run: |
          Write-Host "========================================="
          Write-Host "  Installing Visual Studio Code..."
          Write-Host "========================================="

          $vscodeUrl = "https://update.code.visualstudio.com/latest/win32-x64/stable"
          $installerPath = "$env:TEMP\vscode-installer.exe"

          Invoke-WebRequest -Uri $vscodeUrl -OutFile $installerPath -UseBasicParsing

          Start-Process -FilePath $installerPath -ArgumentList `
            "/verysilent", `
            "/norestart", `
            "/mergetasks=!runcode,addcontextmenufiles,addcontextmenufolders,associatewithfiles,addtopath,desktopicon" `
            -Wait -NoNewWindow

          Remove-Item $installerPath -Force

          $env:Path = [System.Environment]::GetEnvironmentVariable("Path", "Machine") + ";" + `
                      [System.Environment]::GetEnvironmentVariable("Path", "User")

          Write-Host "VS Code installed successfully!"

      # ============================================
      # STEP 7: Install Android SDK + Emulator (Tanpa Restart)
      # ============================================
      - name: Install Android SDK & Create AVD Emulator
        run: |
          Write-Host "========================================="
          Write-Host "  Installing Android SDK & Emulator..."
          Write-Host "========================================="

          $androidHome = "C:\Android"
          $sdkUrl = "https://dl.google.com/android/repository/commandlinetools-win-11076708_latest.zip"
          $sdkZip = "$env:TEMP\cmdtools.zip"

          # Download Android Command Line Tools
          Write-Host "Downloading Android SDK Command Line Tools..."
          Invoke-WebRequest -Uri $sdkUrl -OutFile $sdkZip -UseBasicParsing

          # Extract
          New-Item -ItemType Directory -Path "$androidHome\cmdline-tools" -Force | Out-Null
          Expand-Archive $sdkZip -DestinationPath "$androidHome\cmdline-tools" -Force

          # Android SDK tools hasil extract ada di subfolder "cmdline-tools"
          # Rename ke "latest" sesuai struktur yang dibutuhkan
          $extractedPath = "$androidHome\cmdline-tools\cmdline-tools"
          if (Test-Path $extractedPath) {
            Rename-Item $extractedPath "$androidHome\cmdline-tools\latest" -Force
          }

          # Set environment variables
          [System.Environment]::SetEnvironmentVariable("ANDROID_HOME", $androidHome, "Machine")
          [System.Environment]::SetEnvironmentVariable("ANDROID_SDK_ROOT", $androidHome, "Machine")

          $env:ANDROID_HOME = $androidHome
          $env:ANDROID_SDK_ROOT = $androidHome
          $env:Path += ";$androidHome\cmdline-tools\latest\bin;$androidHome\platform-tools;$androidHome\emulator"

          $sdkmanager = "$androidHome\cmdline-tools\latest\bin\sdkmanager.bat"

          # Accept semua lisensi otomatis
          Write-Host "Accepting Android SDK licenses..."
          for ($i = 0; $i -lt 10; $i++) { echo "y" } | & $sdkmanager --licenses

          # Install komponen SDK
          Write-Host "Installing Android emulator & system image (Android 13, x86_64)..."
          & $sdkmanager `
            "emulator" `
            "platform-tools" `
            "platforms;android-33" `
            "system-images;android-33;google_apis;x86_64"

          # Buat AVD (Android Virtual Device)
          Write-Host "Creating AVD: TestDevice..."
          $avdmanager = "$androidHome\cmdline-tools\latest\bin\avdmanager.bat"
          echo "no" | & $avdmanager create avd `
            --name "TestDevice" `
            --package "system-images;android-33;google_apis;x86_64" `
            --device "pixel_6" `
            --force

          # Buat shortcut script untuk jalankan emulator
          $launchScript = @"
@echo off
echo Starting Android Emulator (TestDevice)...
set ANDROID_HOME=C:\Android
set PATH=%PATH%;C:\Android\emulator;C:\Android\platform-tools
emulator -avd TestDevice -no-snapshot-load -gpu swiftshader_indirect -no-audio
"@
          $launchScript | Out-File -FilePath "C:\Users\Public\Desktop\Start-Android-Emulator.bat" -Encoding ASCII

          Write-Host "Android Emulator setup complete!"
          Write-Host "  -> AVD Name   : TestDevice"
          Write-Host "  -> Android    : 13 (API 33)"
          Write-Host "  -> Device     : Pixel 6"
          Write-Host "  -> Shortcut   : Desktop/Start-Android-Emulator.bat"

          Remove-Item $sdkZip -Force

      # ============================================
      # STEP 8: Install Tailscale & Connect
      # ============================================
      - name: Install Tailscale
        run: |
          Write-Host "========================================="
          Write-Host "  Installing Tailscale..."
          Write-Host "========================================="

          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath -UseBasicParsing
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

          Write-Host "Tailscale installed successfully!"

      - name: Establish Tailscale Connection
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up `
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} `
            --hostname=gh-runner-$env:GITHUB_RUN_ID

          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      # ============================================
      # STEP 9: Verifikasi RDP
      # ============================================
      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }
          Write-Host "TCP connectivity successful!"

      # ============================================
      # STEP 10: Maintain Connection & Print Info
      # ============================================
      - name: Maintain Connection
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                    RDP ACCESS READY"
          Write-Host "============================================================"
          Write-Host ""
          Write-Host "  Connection Info:"
          Write-Host "    Address  : $env:TAILSCALE_IP"
          Write-Host "    Username : $env:RDP_USER"
          Write-Host "    Password : $env:RDP_PASS"
          Write-Host ""
          Write-Host "  Installed Software:"
          Write-Host "    [OK] Python 3.13 (latest)"
          Write-Host "    [OK] Node.js LTS"
          Write-Host "    [OK] Visual Studio Code"
          Write-Host "    [OK] Google Antigravity IDE (Official)"
          Write-Host "    [OK] Android SDK + Emulator (TestDevice - API 33)"
          Write-Host "    [OK] Tailscale VPN"
          Write-Host ""
          Write-Host "  Cara Jalankan Android Emulator:"
          Write-Host "    -> Klik 2x 'Start-Android-Emulator.bat' di Desktop"
          Write-Host "    -> Atau buka Terminal dan ketik:"
          Write-Host "       C:\Android\emulator\emulator -avd TestDevice -gpu swiftshader_indirect"
          Write-Host ""
          Write-Host "  Cara Buka Antigravity:"
          Write-Host "    -> Klik 2x shortcut 'Antigravity' di Desktop"
          Write-Host "    -> Login dengan akun Gmail personal"
          Write-Host "    -> Pilih model: Gemini 3 Pro (gratis)"
          Write-Host ""
          Write-Host "============================================================"
          Write-Host ""

          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active - Use Ctrl+C in workflow to terminate"
              Start-Sleep -Seconds 300
          }
