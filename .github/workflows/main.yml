name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2025
    timeout-minutes: 360

    steps:
      # ============================================
      # STEP 1: Setup Python (sudah pre-installed di runner)
      # Pakai actions/setup-python, TIDAK download manual
      # ============================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify Python
        run: |
          python --version
          pip --version

      # ============================================
      # STEP 2: Setup Node.js (sudah pre-installed di runner)
      # Pakai actions/setup-node, TIDAK download MSI
      # ============================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Node.js
        run: |
          node --version
          npm --version

      # ============================================
      # STEP 3: Konfigurasi RDP
      # ============================================
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 1 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force
          Write-Host "RDP configured!"

      - name: Configure runneradmin for RDP
        run: |
          $username = "runneradmin"
          $password = "P@ssw0rd123!"
          Enable-LocalUser -Name $username
          Set-LocalUser -Name $username -Password (ConvertTo-SecureString -AsPlainText $password -Force)
          Add-LocalGroupMember -Group "Administrators" -Member $username -ErrorAction SilentlyContinue
          echo "RDP_USER=$username" >> $env:GITHUB_ENV
          echo "RDP_PASS=$password" >> $env:GITHUB_ENV

      # ============================================
      # STEP 4: Aktifkan Virtualisasi (Untuk Emulator Android)
      # ============================================
      - name: Enable Virtualization Features
        run: |
          Write-Host "Enabling Hyper-V and virtualization..."
          DISM /Online /Enable-Feature /FeatureName:Microsoft-Hyper-V-All /All /NoRestart /Quiet
          DISM /Online /Enable-Feature /FeatureName:HypervisorPlatform /All /NoRestart /Quiet
          DISM /Online /Enable-Feature /FeatureName:VirtualMachinePlatform /All /NoRestart /Quiet
          Write-Host "Virtualization enabled!"

      # ============================================
      # STEP 5: Install Visual Studio Code
      # URL verified: update.code.visualstudio.com adalah CDN resmi Microsoft
      # ============================================
      - name: Install Visual Studio Code
        run: |
          Write-Host "Downloading VS Code..."
          $url = "https://update.code.visualstudio.com/latest/win32-x64/stable"
          $out = "$env:TEMP\vscode.exe"
          Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing
          Write-Host "Installing VS Code silently..."
          Start-Process -FilePath $out -ArgumentList "/verysilent /norestart /mergetasks=!runcode,addtopath,desktopicon" -Wait -NoNewWindow
          Remove-Item $out -Force
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path", "Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path", "User")
          Write-Host "VS Code installed!"

      # ============================================
      # STEP 6: Install Google Antigravity IDE (Resmi)
      # Download dari antigravity.google - IDE Agent resmi Google
      # ============================================
      - name: Install Google Antigravity IDE
        run: |
          Write-Host "Downloading Google Antigravity IDE from official source..."
          $url = "https://antigravity.google/download/win/x64/stable/AntigravitySetup.exe"
          $out = "$env:TEMP\AntigravitySetup.exe"
          try {
            Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing
            Write-Host "Download success!"
          } catch {
            Write-Host "Trying fallback URL..."
            $url = "https://antigravity.google/download/AntigravitySetup.exe"
            Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing
          }
          Write-Host "Installing Antigravity silently..."
          Start-Process -FilePath $out -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /ALLUSERS /SP-" -Wait -NoNewWindow
          Remove-Item $out -Force -ErrorAction SilentlyContinue
          $exePath1 = "${env:ProgramFiles}\Google\Antigravity\Antigravity.exe"
          $exePath2 = "$env:LOCALAPPDATA\Programs\Antigravity\Antigravity.exe"
          $finalExe = if (Test-Path $exePath1) { $exePath1 } elseif (Test-Path $exePath2) { $exePath2 } else { $null }
          if ($finalExe) {
            $shell = New-Object -ComObject WScript.Shell
            $sc = $shell.CreateShortcut("C:\Users\Public\Desktop\Antigravity.lnk")
            $sc.TargetPath = $finalExe
            $sc.Description = "Google Antigravity AI IDE"
            $sc.Save()
            Write-Host "Antigravity installed! Shortcut on Desktop."
          } else {
            Write-Host "WARNING: Antigravity .exe not found after install. Login via RDP and check manually."
          }

      # ============================================
      # STEP 7: Install Android SDK + Buat Emulator AVD
      # URL SDK tools: verified dari dl.google.com (official)
      # Versi: commandlinetools-win-11076708 (stable)
      # ============================================
      - name: Install Android SDK and Create AVD
        run: |
          Write-Host "Setting up Android SDK..."
          $androidHome = "C:\Android"
          $sdkZip = "$env:TEMP\cmdtools.zip"
          $sdkUrl = "https://dl.google.com/android/repository/commandlinetools-win-11076708_latest.zip"

          Invoke-WebRequest -Uri $sdkUrl -OutFile $sdkZip -UseBasicParsing
          Write-Host "Extracting SDK tools..."
          New-Item -ItemType Directory -Path "$androidHome\cmdline-tools" -Force | Out-Null
          Expand-Archive -Path $sdkZip -DestinationPath "$androidHome\cmdline-tools" -Force

          $extracted = "$androidHome\cmdline-tools\cmdline-tools"
          if (Test-Path $extracted) {
            Rename-Item $extracted "$androidHome\cmdline-tools\latest" -Force
          }

          [System.Environment]::SetEnvironmentVariable("ANDROID_HOME", $androidHome, "Machine")
          [System.Environment]::SetEnvironmentVariable("ANDROID_SDK_ROOT", $androidHome, "Machine")
          $env:ANDROID_HOME = $androidHome
          $env:ANDROID_SDK_ROOT = $androidHome
          $sdkBin = "$androidHome\cmdline-tools\latest\bin"
          $env:Path = "$env:Path;$sdkBin;$androidHome\platform-tools;$androidHome\emulator"

          $sdkmanager = "$sdkBin\sdkmanager.bat"
          Write-Host "Accepting SDK licenses..."
          for ($i = 0; $i -lt 10; $i++) { "y" } | & $sdkmanager --licenses 2>&1 | Out-Null

          Write-Host "Installing Android emulator + system image (Android 13)..."
          & $sdkmanager "emulator" "platform-tools" "platforms;android-33" "system-images;android-33;google_apis;x86_64" 2>&1

          Write-Host "Creating AVD: TestDevice..."
          $avdmanager = "$sdkBin\avdmanager.bat"
          "no" | & $avdmanager create avd --name "TestDevice" --package "system-images;android-33;google_apis;x86_64" --device "pixel_6" --force 2>&1

          $batFile = "C:\Users\Public\Desktop\Start-Android-Emulator.bat"
          "set ANDROID_HOME=C:\Android" | Out-File -FilePath $batFile -Encoding ASCII
          "set PATH=%PATH%;C:\Android\emulator;C:\Android\platform-tools" | Add-Content -Path $batFile
          "emulator -avd TestDevice -no-snapshot-load -gpu swiftshader_indirect -no-audio" | Add-Content -Path $batFile

          Remove-Item $sdkZip -Force
          Write-Host "Android Emulator ready! AVD: TestDevice (Android 13, Pixel 6)"

      # ============================================
      # STEP 8: Install Tailscale
      # URL: verified dari pkgs.tailscale.com (official)
      # ============================================
      - name: Install Tailscale
        run: |
          Write-Host "Downloading Tailscale..."
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $out = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing
          Start-Process msiexec.exe -ArgumentList "/i `"$out`" /quiet /norestart" -Wait
          Remove-Item $out -Force
          Write-Host "Tailscale installed!"

      - name: Establish Tailscale Connection
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          & $ts up --authkey="$env:TAILSCALE_AUTH_KEY" --hostname="gh-runner-$env:GITHUB_RUN_ID"
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
            Start-Sleep -Seconds 5
            $tsIP = & $ts ip -4
            $retries++
          }
          if (-not $tsIP) {
            Write-Error "Tailscale IP tidak dapat diperoleh. Cek authkey."
            exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      # ============================================
      # STEP 9: Verifikasi RDP
      # ============================================
      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          $test = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $test.TcpTestSucceeded) {
            Write-Error "RDP port 3389 tidak bisa diakses!"
            exit 1
          }
          Write-Host "RDP port 3389 OK!"

      # ============================================
      # STEP 10: Maintain Connection (loop sampai timeout 6 jam)
      # ============================================
      - name: Maintain Connection
        run: |
          Write-Host "============================================================"
          Write-Host "               RDP ACCESS READY - CONNECT NOW"
          Write-Host "============================================================"
          Write-Host "  Address  : $env:TAILSCALE_IP"
          Write-Host "  Username : $env:RDP_USER"
          Write-Host "  Password : $env:RDP_PASS"
          Write-Host ""
          Write-Host "  Software yang terinstall:"
          Write-Host "    [OK] Python 3.13"
          Write-Host "    [OK] Node.js 22 LTS"
          Write-Host "    [OK] Visual Studio Code"
          Write-Host "    [OK] Google Antigravity IDE (login Gmail setelah buka)"
          Write-Host "    [OK] Android SDK + AVD TestDevice (Android 13 / Pixel 6)"
          Write-Host "    [OK] Tailscale VPN"
          Write-Host ""
          Write-Host "  Cara jalankan Emulator Android:"
          Write-Host "    Klik 2x 'Start-Android-Emulator.bat' di Desktop"
          Write-Host "  Cara buka Antigravity:"
          Write-Host "    Klik shortcut 'Antigravity' di Desktop, lalu login Gmail"
          Write-Host "============================================================"
          while ($true) {
            Write-Host "[$(Get-Date -Format 'HH:mm:ss')] RDP aktif - stop dengan cancel workflow"
            Start-Sleep -Seconds 300
          }
          
